# static site — nothing to build, so deploys cost no build minutes
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/p/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
