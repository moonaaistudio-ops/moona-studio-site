:root {
  color-scheme: dark;
  --void: #05070c;
  --panel: #080b13;
  --line: rgba(168, 198, 232, .16);
  --ice: #dcecff;
  --ice-dim: #a8c6e8;
  --ice-mute: rgba(220, 236, 255, .8);
  --gold: #d9c69c;
  --he: "Assistant", "Arial Hebrew", Arial, sans-serif;
  --latin: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "Space Mono", Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  padding-inline: clamp(16px, 4vw, 56px);
  background: var(--void);
  color: var(--ice);
  font: 400 17px/1.55 var(--he);
}
.wrap { max-width: 1080px; margin-inline: auto; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
.top {
  display: flex;
  align-items: center;
  gap: 18px;
  padding-block: clamp(22px, 4vw, 42px);
}
.top img { display: block; height: 26px; width: auto; }
.top img.ttf { height: 46px; }
.top .x { color: var(--gold); font: 14px var(--mono); }
.hero {
  display: grid;
  grid-template-columns: minmax(245px, 350px) minmax(0, 1fr);
  gap: clamp(32px, 7vw, 92px);
  align-items: center;
  padding-block: clamp(6px, 2vw, 20px) clamp(42px, 6vw, 70px);
}
.hero-copy { grid-column: 2; grid-row: 1; }
.collection {
  margin: 0 0 6px;
  color: var(--gold);
  font: 500 16px/1.3 var(--latin);
  letter-spacing: .08em;
  direction: ltr;
  text-align: right;
}
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(36px, 5.5vw, 63px); font-weight: 700; }
.hero figure { margin: 0; grid-column: 1; grid-row: 1; scroll-margin-top: 16px; }
video {
  display: block;
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 16px;
  background: var(--panel);
}
.moments {
  padding-block: clamp(32px, 4.5vw, 54px);
  border-top: 1px solid var(--line);
}
.moments h2 { margin-bottom: 22px; font-size: clamp(28px, 3.5vw, 39px); }
.row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(18px, 3vw, 34px) clamp(14px, 2vw, 24px);
}
.moments figure { margin: 0; min-width: 0; }
.ph {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border: 0;
  border-radius: 12px;
  padding: 0;
  background: var(--panel);
  cursor: pointer;
}
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
.ph:focus-visible { outline-offset: 3px; }
.moments figcaption { padding-block-start: 11px; }
.moments h3 { color: var(--gold); font-size: 23px; }
.moments figcaption p { margin: 5px 0 0; font-size: 19px; line-height: 1.5; }
.moments figcaption a {
  color: var(--ice);
  text-decoration-color: rgba(168, 198, 232, .48);
  text-decoration-thickness: 1px;
  text-underline-offset: .2em;
}
.moments figcaption a:hover, .moments figcaption a:focus-visible {
  color: var(--gold);
  text-decoration-color: currentColor;
}
footer {
  padding-block: clamp(20px, 3vw, 32px) clamp(26px, 5vw, 52px);
  border-top: 1px solid var(--line);
}
.brief-note h2 { font-size: 20px; }
.brief-note p {
  max-width: 57ch;
  margin: 8px 0 0;
  color: var(--ice);
  font-size: 18px;
  line-height: 1.6;
}
.brief-note .note-intro { font-weight: 600; }
@media (max-width: 680px) {
  .top { gap: 14px; padding-block: 20px; }
  .top img.ttf { height: 38px; }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 8px; }
  .hero-copy, .hero figure { grid-column: 1; grid-row: auto; }
  .hero figure { width: min(100%, 340px); justify-self: start; }
  h1 { font-size: clamp(32px, 8.2vw, 45px); }
  .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 480px) {
  .row { grid-template-columns: 1fr; gap: 14px; }
  .moments figure {
    display: grid;
    grid-template-columns: minmax(74px, 28%) minmax(0, 1fr);
    align-items: center;
    gap: 13px;
  }
  .moments figcaption { padding: 0; }
  .moments h3 { font-size: 21px; }
  .moments figcaption p { font-size: 18px; }
}
</style>

<script>
const player = document.querySelector("video");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
for (const button of document.querySelectorAll("button[data-time]")) {
  button.addEventListener("click", () => {
    player.focus({preventScroll: true});
    document.querySelector("#reel").scrollIntoView({
      block: "start",
      behavior: reducedMotion.matches ? "instant" : "smooth",
    });
    const seek = () => {
      player.currentTime = Number(button.dataset.time);
      player.play().catch(() => {});
    };
    if (player.readyState >= 1) seek();
    else player.addEventListener("loadedmetadata", seek, {once: true});
  });
}
</script>
